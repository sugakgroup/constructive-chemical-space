name: CCS tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccs-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify S1–S4 core
        run: |
          python -m pytest -q \
            tests/test_s1_formal.py \
            tests/test_s2_replay.py \
            tests/test_s3_coverage.py \
            tests/test_s4_practical.py

  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install visualization and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run all regression tests including S5 notebook provenance
        run: python -m pytest -q
