name: CCS representative smoke / optional full validation

on:
  push:
    branches: [feature/s5-records-validation]
    paths:
      - .github/workflows/tests.yml
      - src/constructive_chemical_space/**
      - tests/**
      - examples/s5/_common.py
      - examples/s5/execute_notebooks.py
      - examples/s5/generate_explicit_words.py
      - examples/s5/data/**
  workflow_dispatch:
    inputs:
      scope:
        description: "Use representative smoke during editing; full only at final review"
        type: choice
        required: true
        default: representative
        options: [representative, full]

permissions:
  contents: read

concurrency:
  group: ccs-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  representative-smoke:
    if: github.event_name == 'push' || inputs.scope != 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional visualization and kernel dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "nbclient>=0.10" "nbformat>=5.10" "ipykernel>=6"
      - name: Fast representative CCS core, notation, planarity, and S5 tests
        run: |
          python -m pytest -q \
            tests/test_s1_formal.py \
            tests/test_s2_replay.py \
            tests/test_visualization.py::test_amine_nitrogen_displays_two_residual_valence_dots \
            tests/test_visualization.py::test_water_oxygen_displays_four_valence_residual_dots \
            tests/test_visualization.py::test_assignment_imbalance_signs_and_valence_dots \
            tests/test_visualization.py::test_2d_planar_K4_has_zero_straight_line_crossings \
            tests/test_visualization.py::test_nonplanar_K5_is_detected_and_accurately_warned \
            tests/test_visualization.py::test_dense_s5_layout_is_independent_of_element_category \
            tests/test_visualization.py::test_old_cluster_specific_layout_flag_is_not_supported \
            tests/test_visualization.py::test_generic_spacing_keeps_explicit_h_nuclei_distinct \
            tests/test_visualization.py::test_residual_dots_remain_close_to_ligand_nuclei \
            tests/test_visualization.py::test_residual_dots_are_svg_vector_circles_not_utf8_text \
            tests/test_s5_examples.py::test_record13_bisperiazulene_author_corrected_formB_C \
            'tests/test_s5_examples.py::test_all_literal_notebook_words_replay_into_full_ccs_objects[13]' \
            'tests/test_s5_examples.py::test_all_literal_notebook_words_replay_into_full_ccs_objects[36]' \
            'tests/test_s5_examples.py::test_all_literal_notebook_words_replay_into_full_ccs_objects[46]'
      - name: Real ipykernel smoke — eight representative SI examples, not 55
        run: |
          python examples/s5/generate_explicit_words.py
          python examples/s5/execute_notebooks.py \
            --records 2 13 18 21 42 43 44 46 \
            --preview-dir examples/s5/smoke_preview
          echo "Preview SVGs are genuine kernel outputs. No full-corpus result is committed."
      - name: Save ephemeral, real-kernel S5 cluster previews
        uses: actions/upload-artifact@v4
        with:
          name: s5-smoke-clusters-${{ github.run_id }}
          retention-days: 5
          if-no-files-found: error
          path: |
            examples/s5/smoke_preview/*.svg
            examples/s5/smoke_execution_report.json

  final-full-suite:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install all test and visualization dependencies
        run: python -m pip install -e ".[dev]"
      - name: Full tests — only upon explicit final-review dispatch
        run: python -m pytest -q
