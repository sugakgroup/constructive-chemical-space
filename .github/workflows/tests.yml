name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run core tests
        run: python -m pytest tests/test_s1_formal.py tests/test_s2_replay.py tests/test_s3_coverage.py tests/test_s4_practical.py tests/test_s5_records.py

  rdkit_visualization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with RDKit and visualization extras
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite including visualization
        run: python -m pytest
