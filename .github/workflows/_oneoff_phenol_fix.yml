name: One-time phenol Form C v1.0.0 repair
on:
  push:
    branches:
      - fix/phenol-form-c-v1-release-20261015

permissions:
  contents: write

concurrency:
  group: phenol-form-c-v1-release
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package, verification, and real Jupyter kernel dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "nbclient>=0.10" "nbformat>=5.10" "ipykernel>=6"
      - name: Correct S5 phenol Form C, source manifest, and audit provenance
        run: python scripts/_oneoff_repair_phenol.py
      - name: Generate literal construction words for all 55 notebooks
        run: python examples/s5/generate_explicit_words.py
      - name: Re-execute all 55 notebooks in genuine Jupyter kernels
        run: python examples/s5/execute_notebooks.py
      - name: Run all tests, including new Figure 2 correspondence regression
        run: python -m pytest -q
      - name: Commit only corrected data, notebooks, regression, and documentation
        run: |
          git rm -- scripts/_oneoff_repair_phenol.py .github/workflows/_oneoff_phenol_fix.yml
          git add -- README.md S5_VALIDATION.md examples/s5 tests/test_s5_phenol_form_c.py
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(s5): align phenol Form C with para-charge-separated Figure 2"
          git push origin HEAD:fix/phenol-form-c-v1-release-20261015
