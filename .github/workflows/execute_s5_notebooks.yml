name: S5 full real-kernel reproducibility (manual only)

on:
  workflow_dispatch:

# Running notebooks never pushes or changes the canonical repository branch.
permissions:
  contents: read

concurrency:
  group: s5-manual-reproducibility
  cancel-in-progress: false

jobs:
  execute-all-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CCS and real Jupyter execution dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "nbclient>=0.10" "nbformat>=5.10" "ipykernel>=6"
      - name: Verify the author-confirmed Record 13 correction
        run: python examples/s5/correct_record13.py
      - name: Generate source-only literal Words, never simulate outputs
        run: python examples/s5/generate_explicit_words.py
      - name: Execute all 55 S5 notebooks with actual ipykernels
        run: python examples/s5/execute_notebooks.py
      - name: Test all saved S5 output and visualization invariants
        run: python -m pytest -q tests/test_s5_examples.py tests/test_visualization.py
      - name: Archive genuine executed notebooks and provenance
        uses: actions/upload-artifact@v4
        with:
          name: s5-real-kernel-full-${{ github.run_id }}
          retention-days: 5
          if-no-files-found: error
          path: |
            examples/s5/notebooks/*.ipynb
            examples/s5/execution_report.json
